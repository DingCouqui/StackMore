name: StackMore
version: "${version}"
main: io.github.dingcouqui.stackmore.StackMorePlugin
api-version: "1.21"
description: Allows stacking of blocks beyond 64 with special oversized stacks.
folia-supported: false
commands:
  stack:
    description: Create or add to a special stack
    usage: /<command> [amount|all]
    aliases: [sm, stk]
  stackto:
    description: Fill special stack to a specific amount
    usage: /<command> <amount>
    aliases: [stkto]
  unstack:
    description: Unstack items from special stack
    usage: /<command> [amount|all]
    aliases: [unstk]
  unstackto:
    description: Unstack to a specific amount
    usage: /<command> <amount>
    aliases: [unstkto]
  stackinfo:
    description: Show info about held special stack
    usage: /<command>
  stackmore:
    description: Admin commands for StackMore
    usage: /<command> reload
permissions:
  stackmore.use:
    default: true
  stackmore.admin:
    default: op